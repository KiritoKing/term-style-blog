name: Install verified Cloudflare BSM tools
description: Install pinned BWS and fnox Linux x86_64 binaries from verified official releases.
runs:
  using: composite
  steps:
    - name: Install BWS 2.1.0
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/term-style-blog-bws"
        archive="$install_dir/bws.zip"
        mkdir -p "$install_dir"
        curl --fail --silent --show-error --location \
          https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip \
          --output "$archive"
        echo 'ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  bws.zip' \
          | (cd "$install_dir" && sha256sum --check)
        unzip -q "$archive" -d "$install_dir"
        chmod 700 "$install_dir/bws"
        "$install_dir/bws" --version | grep -Fx 'bws 2.1.0'
        echo "$install_dir" >> "$GITHUB_PATH"
    - name: Install fnox 1.39.0
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/term-style-blog-fnox"
        archive="$install_dir/fnox.tar.gz"
        mkdir -p "$install_dir"
        curl --fail --silent --show-error --location \
          https://github.com/jdx/fnox/releases/download/v1.39.0/fnox-x86_64-unknown-linux-gnu.tar.gz \
          --output "$archive"
        echo '0a623ed38907b9cb633d07593b4d19a4ba741a6a50d226eb243bd16f2f5ba81b  fnox.tar.gz' \
          | (cd "$install_dir" && sha256sum --check)
        tar -xzf "$archive" -C "$install_dir" fnox
        chmod 700 "$install_dir/fnox"
        "$install_dir/fnox" --version | grep -Fx 'fnox 1.39.0'
        echo "$install_dir" >> "$GITHUB_PATH"
