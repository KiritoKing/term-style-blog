name: Read-only Cloudflare credential check

on:
  push:
    branches: [codex/cloudflare-bsm-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    if: github.repository == 'KiritoKing/term-style-blog'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read Engineer credential from Bitwarden
        id: cloudflare_token
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.CLOUDFLARE_BWS_ACCESS_TOKEN }}
          secrets: |
            3d8050c9-478f-41b1-aeb6-b4e400d2a1b8 > CLOUDFLARE_API_TOKEN
          set_env: false
      - name: Verify BSM resolution, token status, and Pages metadata with GET-only requests
        run: python .github/scripts/verify_cloudflare_readonly.py pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare_token.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'notion-astro-rev' }}
