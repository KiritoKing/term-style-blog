name: Read-only Cloudflare credential check

on:
  push:
    branches: [codex/cloudflare-bsm-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    if: github.repository == 'KiritoKing/term-style-blog'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cloudflare-tools
      - name: Verify BSM resolution, token status, and Pages metadata with GET-only requests
        run: >-
          python .github/scripts/cf_secrets.py
          --profile pages
          --config cloudflare-secrets.toml
          --
          python .github/scripts/verify_cloudflare_readonly.py pages
        env:
          CLOUDFLARE_BWS_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_BWS_ACCESS_TOKEN }}
          CLOUDFLARE_BWS_PROJECT_ID: ${{ vars.CLOUDFLARE_BWS_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'notion-astro-rev' }}
