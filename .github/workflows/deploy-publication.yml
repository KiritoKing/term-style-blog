name: Authorized first production cutover
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit first-release authorization (replace-chlorinec-top-20260909)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publication-production-notion-astro-rev
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  cutover:
    if: github.ref == 'refs/heads/codex/production-cutover-20260909' && inputs.approval == 'replace-chlorinec-top-20260909'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout fixed operation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: operation
          persist-credentials: false
      - name: Checkout accepted framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a206bc1d8fd631d48a85e3450985b1651a0c1e23
          path: framework
          persist-credentials: true
      - name: Checkout accepted content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KiritoKing/llm-obsidian
          ref: d9dbbe357e528ae654f5474046675fb45c0dfdbc
          ssh-key: ${{ secrets.VAULT_CONTENTS_READ_KEY }}
          persist-credentials: true
          path: content
          sparse-checkout: |
            blog-publish-manifest.json
            20-writing/published
          sparse-checkout-cone-mode: false
      - name: Download exact successful preview record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 34280652058
          name: preview-deployment-record-a206bc1d8fd631d48a85e3450985b1651a0c1e23-d9dbbe357e528ae654f5474046675fb45c0dfdbc
          path: approval
      - name: Verify explicit authorization and immutable preview
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL: ${{ inputs.approval }}
        run: node operation/.agent/operations/cutover-20260909.mjs approval
      - name: Validate exact source
        run: >-
          node framework/scripts/validate-publication-snapshot.mjs snapshot
          --root content
          --manifest-sha256 75e86ac4805dc56a00113de367fd758f903814fae9217d8f31bce0260289a098
          --source-tree-hash 7d2ae41c519325a28cfe3ad68e4c202821f4b89819d761ec81c01f8249aeb86c
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.28.0
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: framework/pnpm-lock.yaml
      - name: Build verified production artifact
        working-directory: framework
        env:
          CONTENT_DIR: ${{ github.workspace }}/content/20-writing/published
          EXPECTED_CONTENT_COUNT: '53'
          PUBLIC_DEPLOYMENT_ENV: production
          STRICT_CONTENT_ASSETS: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm test:deployment
          pnpm test
          pnpm check
          pnpm build:content
          node scripts/validate-publication-snapshot.mjs site --root dist --mode production
          pnpm exec playwright install --with-deps chromium
      - name: Verify production artifact in browser
        working-directory: framework
        env:
          E2E_POST_SLUG: KeePass
          E2E_SEARCH_QUERY: 前端
          E2E_REAL_CORPUS: '1'
          E2E_REAL_LISTINGS: '1'
        run: pnpm test:e2e
      - name: Capture rollback baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node operation/.agent/operations/cutover-20260909.mjs backup
      - name: Preserve rollback before mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cutover-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/blog-cutover
          if-no-files-found: error
      - name: Disable old Notion Git production writer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node operation/.agent/operations/cutover-20260909.mjs disable
      - name: Deploy accepted first production
        id: production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ef0d144e8d1febe747ef0068815b9730
          wranglerVersion: 4.130.0
          workingDirectory: framework
          command: >-
            pages deploy dist --project-name=notion-astro-rev --branch=main
            --commit-hash=a206bc1d8fd631d48a85e3450985b1651a0c1e23
            --commit-message=authorized-cutover-${{ github.run_id }}
      - name: Verify production ownership and settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.production.outputs.pages-deployment-id }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.production.outputs.pages-environment }}
        run: |
          test "$DEPLOYMENT_ENVIRONMENT" = production
          node operation/.agent/operations/cutover-20260909.mjs verify
      - name: Verify public production indexing and content
        run: |
          curl --fail --retry 3 --max-time 45 https://chlorinec.top/ -o "$RUNNER_TEMP/blog-cutover/index.html"
          curl --fail --retry 3 --max-time 45 https://chlorinec.top/robots.txt -o "$RUNNER_TEMP/blog-cutover/robots.txt"
          grep -q 'data-terminal-shell' "$RUNNER_TEMP/blog-cutover/index.html"
          grep -Eiq 'name="robots"[^>]*content="index, follow"' "$RUNNER_TEMP/blog-cutover/index.html"
          ! grep -Eiq 'noindex' "$RUNNER_TEMP/blog-cutover/index.html"
          grep -Eq '^Allow: /$' "$RUNNER_TEMP/blog-cutover/robots.txt"
          ! grep -Eq '^Disallow: /$' "$RUNNER_TEMP/blog-cutover/robots.txt"
      - name: Verify public production in real Chromium
        working-directory: framework
        env:
          E2E_POST_SLUG: KeePass
          E2E_SEARCH_QUERY: 前端
          E2E_REAL_CORPUS: '1'
          E2E_REAL_LISTINGS: '1'
        run: |
          cat > playwright.production.config.ts <<'CONFIG'
          import { defineConfig } from '@playwright/test';
          import base from './playwright.config';
          export default defineConfig({...base, testDir: './tests/hosted-e2e', webServer: undefined, use: {...base.use, baseURL: 'https://chlorinec.top'}});
          CONFIG
          node ../operation/.agent/operations/prepare-hosted-tests.mjs .
          pnpm exec playwright test --config playwright.production.config.ts --grep-invert "serves historical redirects as 301"
          node --input-type=module -e 'import assert from "node:assert/strict";const r=await fetch("https://chlorinec.top/post/technology/keepass",{redirect:"manual"});assert.equal(r.status,301);assert.equal(new URL(r.headers.get("location"),"https://chlorinec.top").href,"https://chlorinec.top/posts/KeePass");'
      - name: Restore captured state if deployment or acceptance fails
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node operation/.agent/operations/cutover-20260909.mjs rollback
      - name: Preserve sanitized production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cutover-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/blog-cutover
            framework/test-results
          if-no-files-found: warn
