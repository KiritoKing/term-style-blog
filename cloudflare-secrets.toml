# Keep this filename: fnox.<profile>.toml changes provider profile resolution.
root = true
env = "exec"
if_missing = "error"
prompt_auth = false

[providers]
cf_deploy = { type = "bitwarden-sm" }

[profiles.pages.secrets]
CLOUDFLARE_API_TOKEN = { provider = "cf_deploy", value = "[Cloudflare · Blog Deploy] API Token" }
